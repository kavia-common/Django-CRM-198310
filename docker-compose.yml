version: "3.9"

services:
  db:
    image: postgres:16
    env_file:
      - ./db.env
    # volumes:
    #   - /home/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DBUSER -d $$DBNAME -h 127.0.0.1 -p $$DBPORT"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        # Dockerfile currently requires APP_NAME for cache/test; keep it stable.
        APP_NAME: Django-CRM-198310
    image: micropyramid/django-crm:1
    env_file:
      - ./db.env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Run migrations on container boot for cold-start readiness.
      RUN_MIGRATIONS: "true"
      # In-container bind target
      HOST: "0.0.0.0"
    command: ["python", "/app/backend/manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      # Use existing Django template endpoint to avoid changing API contracts.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  celery:
    build:
      context: .
      args:
        APP_NAME: Django-CRM-198310
    image: micropyramid/django-crm:1
    env_file:
      - ./db.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Enforce requested ordering: postgres -> web -> celery
      web:
        condition: service_healthy
    environment:
      # Celery should not run migrations.
      RUN_MIGRATIONS: "false"
    command: ["celery", "-A", "crm", "worker", "--loglevel=INFO"]
    healthcheck:
      # Minimal health signal: ensure the celery process exists in the container.
      # (We avoid requiring extra celery ping configuration and broker auth here.)
      test: ["CMD-SHELL", "ps aux | grep -q '[c]elery\\s\\+-A\\s\\+crm\\s\\+worker'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
